process:
  name: 4p12s-delivery
  display_name: 标准需求交付工艺（4P12S）
  description: |
    4 阶 12 步裁剪版：需求 → 故事 → 设计 → 计划 → Tasking → TDD → 测试 → 提交。
    适合常规软件需求交付，每个阶段都有产物与门禁。
  category: software
  complexity: standard
  version: 1.0.0
limits:
  max_step_executions: 80
  max_total_tokens: 200000
abnormal_handler:
  trigger_on: [capped_step, capped_token, failed]
phases:
  - id: requirement
    name: 需求
    spec: |
      先统一输入，再定义如何证明完成。
      输出 PRD，明确功能清单、验收标准、非目标。
    acceptance_criteria: |
      1. PRD.md 存在且包含验收标准章节。
      2. 所有功能点可测试或可验证。
    links:
      - id: req-01
        name: 生成 PRD
        step_template: []
        prompt: |
          请根据用户输入的需求，编写一份完整的产品需求文档（PRD）。
          PRD 必须包含：背景、目标、非目标、功能清单、验收标准、接口/边界说明。
          将结果写入 docs/requirements/{process_name}-PRD.md。
        expert: product-manager
        skills: [4p12s-prd]
        model: claude-sonnet-5
        acceptance_criteria: |
          docs/requirements/{process_name}-PRD.md 存在且包含「验收标准」章节。
        expected_artifacts:
          - name: PRD
            type: file
            path: docs/requirements/{process_name}-PRD.md
        gates:
          - name: PRD 存在
            type: artifact_present
            artifact: PRD
        on_success: next
        on_gate_fail: req-01
        max_rework: 3
      - id: req-01b
        name: 拆解用户故事
        step_template: []
        prompt: |
          阅读 docs/requirements/{process_name}-PRD.md，把功能清单拆分为可交付的用户故事列表。
          每个故事需包含：标题、As a / I want / So that、验收条件（Given/When/Then）。
          将结果追加或更新到 docs/requirements/{process_name}-stories.md。
        expert: product-manager
        skills: [4p12s-stories]
        model: claude-sonnet-5
        acceptance_criteria: |
          docs/requirements/{process_name}-stories.md 存在且每个用户故事都有验收条件。
        expected_artifacts:
          - name: user-stories
            type: file
            path: docs/requirements/{process_name}-stories.md
        gates:
          - name: 用户故事存在
            type: artifact_present
            artifact: user-stories
        on_success: next
        on_gate_fail: req-01b
        max_rework: 3
      - id: req-02
        name: 人工确认 PRD
        step_template: []
        prompt: |
          请人工确认上一阶段产物是否满足验收标准。
          确认通过后，流程继续；不通过则回退到上游环节。
        expert: product-manager
        acceptance_criteria: |
          人工审批通过。
        review_type: human
        gates:
          - name: 产品负责人审批
            type: human_approval
        on_success: next
        on_gate_fail: req-01

  - id: design
    name: 设计
    spec: |
      基于 PRD 做技术设计，输出设计文档。
    acceptance_criteria: |
      1. 设计文档覆盖数据模型、API、关键决策。
      2. 每个功能点都有对应设计章节。
    links:
      - id: des-01
        name: 技术设计
        step_template: []
        prompt: |
          基于 PRD 和用户故事，输出技术设计文档。
          包含：模块划分、数据模型、API 草图、关键技术决策、风险与回退方案。
          将结果写入 docs/design/{process_name}-design.md。
        expert: architect
        skills: [4p12s-design]
        model: claude-sonnet-5
        acceptance_criteria: |
          docs/design/{process_name}-design.md 存在，且每个功能点都能映射到设计章节。
        expected_artifacts:
          - name: design-doc
            type: file
            path: docs/design/{process_name}-design.md
        gates:
          - name: 设计文档存在
            type: artifact_present
            artifact: design-doc
        on_success: next
        on_gate_fail: des-01
      - id: des-02
        name: 人工确认设计
        step_template: []
        prompt: |
          请人工确认上一阶段产物是否满足验收标准。
          确认通过后，流程继续；不通过则回退到上游环节。
        expert: product-manager
        acceptance_criteria: |
          人工审批通过。
        review_type: human
        gates:
          - name: 架构师审批
            type: human_approval
        on_success: next
        on_gate_fail: des-01

  - id: implementation
    name: 实现
    spec: |
      按计划拆任务，TDD 循环开发，最终跑通测试与 lint。
    acceptance_criteria: |
      1. 所有计划任务完成。
      2. 测试与 lint 零错误。
    links:
      - id: imp-01
        name: 制定开发计划
        step_template: []
        prompt: |
          根据技术设计，制定可执行的开发任务清单。
          每个任务需包含：任务名、预估工时、依赖关系、验收标准。
          将结果写入 docs/plan/{process_name}-plan.md。
        expert: tech-lead
        skills: [4p12s-plan]
        model: claude-sonnet-5
        acceptance_criteria: |
          docs/plan/{process_name}-plan.md 存在，任务可覆盖设计中的全部模块。
        expected_artifacts:
          - name: plan-doc
            type: file
            path: docs/plan/{process_name}-plan.md
        gates:
          - name: 计划文档存在
            type: artifact_present
            artifact: plan-doc
        on_success: next
        on_gate_fail: imp-01
      - id: imp-02
        name: TDD 开发循环
        step_template: []
        prompt: |
          按照开发计划，以 TDD 方式实现一个任务：先写失败测试，再写最小实现，再重构。
          每完成一个任务，更新任务状态并提交一次代码（或生成 diff）。
          在 .ntd/delivery-state.md 中记录当前已完成功能。
        expert: senior-dev
        skills: [4p12s-tdd]
        model: claude-sonnet-5
        acceptance_criteria: |
          对应任务有测试覆盖，且测试通过。
        expected_artifacts:
          - name: delivery-state
            type: file
            path: .ntd/delivery-state.md
        gates:
          - name: delivery-state 更新
            type: artifact_present
            artifact: delivery-state
        on_success: next
        on_gate_fail: imp-02
      - id: imp-03
        name: 测试与检查
        step_template: []
        prompt: |
          运行项目级测试与 lint（如 cargo test / npx tsc --noEmit / npm run build）。
          修复失败项，直到零错误零告警。
          将测试报告摘要写入 .ntd/test-report.md。
        expert: senior-dev
        skills: [4p12s-test]
        model: claude-sonnet-5
        acceptance_criteria: |
          测试与 lint 全部通过。
        expected_artifacts:
          - name: test-report
            type: file
            path: .ntd/test-report.md
        gates:
          - name: 测试通过
            type: script_check
            script: run_tests.sh
        on_success: next
        on_gate_fail: imp-02

  - id: delivery
    name: 交付
    spec: |
      整理变更、补充文档、标记交付完成。
    acceptance_criteria: |
      1. delivery-state.md 标记完成。
      2. 变更可审计。
    links:
      - id: del-01
        name: 提交与交付
        step_template: []
        prompt: |
          整理变更日志、补充文档、准备交付说明。
          提交代码（或生成最终 patch），并在 .ntd/delivery-state.md 中标记交付完成。
        expert: tech-lead
        skills: [4p12s-release]
        model: claude-sonnet-5
        acceptance_criteria: |
          .ntd/delivery-state.md 存在且状态为完成，变更可审计。
        expected_artifacts:
          - name: delivery-state
            type: file
            path: .ntd/delivery-state.md
        gates:
          - name: 交付状态完成
            type: artifact_present
            artifact: delivery-state
        on_success: end
        on_gate_fail: del-01
