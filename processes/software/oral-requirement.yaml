process:
  name: oral-requirement
  guid: 1d04689c-971d-4fba-ae0a-b33d0d216d20
  display_name: 口头需求工艺
  description: |
    适合口头/IM 提出的临时需求：先补 PRD，再进入轻量实现。
    核心目标是把口头需求快速变成可验证的书面产物。
  category: software
  complexity: light
  version: 1.0.0
limits:
  max_step_executions: 40
  max_total_tokens: 100000
abnormal_handler:
  trigger_on: [capped_step, capped_token, failed]
phases:
  - id: requirement
    name: 补需求
    spec: |
      把口头需求整理成 PRD，明确范围与验收标准。
    acceptance_criteria: |
      PRD.md 存在且包含验收标准。
    links:
      - id: req-01
        name: 补写 PRD
        step_template: []
        prompt: |
          请根据用户输入的需求，编写一份完整的产品需求文档（PRD）。
          PRD 必须包含：背景、目标、非目标、功能清单、验收标准、接口/边界说明。
          将结果写入 docs/requirements/{process_name}-PRD.md。
        expert: product-manager
        skills: [4p12s-prd]
        model: claude-sonnet-5
        acceptance_criteria: |
          docs/requirements/{process_name}-PRD.md 存在且包含「验收标准」章节。
        expected_artifacts:
          - name: PRD
            type: file
            path: docs/requirements/{process_name}-PRD.md
        gates:
          - name: PRD 存在
            type: ai_criteria_review
            min_score: 60
        on_success: next
        on_gate_fail: req-01
        max_rework: 2

  - id: implement
    name: 实现
    spec: |
      基于 PRD 直接实现并自测。
    acceptance_criteria: |
      1. 实现完成。
      2. 测试通过。
    links:
      - id: imp-01
        name: 实现任务
        prompt: |
          根据 PRD 实现功能，完成后运行测试与 lint。
        executor: atomcode
        expert_name: senior-dev
        skills: []
        expected_artifacts:
          - name: delivery-state
            type: file
            path: .ntd/delivery-state.md
        gates:
          - name: 实现产物
            type: ai_criteria_review
            min_score: 60
        on_success: next
        on_gate_fail: imp-01
        max_rework: 2
      - id: imp-02
        name: 运行测试
        step_template: []
        prompt: |
          运行项目级测试与 lint（如 cargo test / npx tsc --noEmit / npm run build）。
          修复失败项，直到零错误零告警。
          将测试报告摘要写入 .ntd/test-report.md。
        expert: senior-dev
        skills: [4p12s-test]
        model: claude-sonnet-5
        acceptance_criteria: |
          测试与 lint 全部通过。
        expected_artifacts:
          - name: test-report
            type: file
            path: .ntd/test-report.md
        gates:
          - name: 测试通过
            type: ai_criteria_review
            min_score: 60
        on_success: next
        on_gate_fail: imp-01

  - id: delivery
    name: 交付
    spec: |
      提交变更并标记完成。
    acceptance_criteria: |
      变更可审计。
    links:
      - id: del-01
        name: 提交
        step_template: []
        prompt: |
          整理变更日志、补充文档、准备交付说明。
          提交代码（或生成最终 patch），并在 .ntd/delivery-state.md 中标记交付完成。
        expert: tech-lead
        skills: [4p12s-release]
        model: claude-sonnet-5
        acceptance_criteria: |
          .ntd/delivery-state.md 存在且状态为完成，变更可审计。
        expected_artifacts:
          - name: delivery-state
            type: file
            path: .ntd/delivery-state.md
        gates:
          - name: 交付完成
            type: ai_criteria_review
            min_score: 60
        on_success: end
        on_gate_fail: del-01
