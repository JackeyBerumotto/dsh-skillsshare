process:
  name: lightweight-task
  display_name: 轻量任务工艺
  description: |
    6 步轻量工艺：brainstorm → plan → TDD → code-review → verify → reflect。
    适合小需求、Bug 修复、脚本编写，保留最少必要的产物与门禁。
  category: software
  complexity: light
  version: 1.0.0
limits:
  max_step_executions: 30
  max_total_tokens: 50000
abnormal_handler:
  trigger_on: [capped_step, capped_token, failed]
phases:
  - id: execute
    name: 执行
    spec: |
      从 brainstorm 到 reflect 的六步轻量循环。每步均配产物与门禁，
      但门禁阈值较宽松（max_rework=2），适合快速迭代。
    acceptance_criteria: |
      1. 有实现产出。
      2. 测试/lint 通过或记录修复日志。
      3. 完成 reflect 总结。
    links:
      - id: s01
        name: 头脑风暴
        prompt: |
          理解需求，列出 2-3 种实现方案的优缺点，选择推荐方案并给出理由。
          输出到 .ntd/brainstorm.md。
        executor: atomcode
        expert_name: senior-dev
        skills: []
        expected_artifacts:
          - name: brainstorm
            type: file
            path: .ntd/brainstorm.md
        gates:
          - name: 方案存在
            type: artifact_present
            artifact: brainstorm
        on_success: next
        on_gate_fail: s01
        max_rework: 2
      - id: s02
        name: 编写计划
        prompt: |
          基于选定的方案，写出实现计划（5-10 个步骤），输出到 .ntd/plan.md。
        executor: atomcode
        expert_name: senior-dev
        skills: []
        expected_artifacts:
          - name: plan
            type: file
            path: .ntd/plan.md
        gates:
          - name: 计划存在
            type: artifact_present
            artifact: plan
        on_success: next
        on_gate_fail: s02
        max_rework: 2
      - id: s03
        name: TDD 开发
        step_template: []
        prompt: |
          按照开发计划，以 TDD 方式实现一个任务：先写失败测试，再写最小实现，再重构。
          每完成一个任务，更新任务状态并提交一次代码（或生成 diff）。
          在 .ntd/delivery-state.md 中记录当前已完成功能。
        expert: senior-dev
        skills: [4p12s-tdd]
        model: claude-sonnet-5
        acceptance_criteria: |
          对应任务有测试覆盖，且测试通过。
        expected_artifacts:
          - name: test-report
            type: file
            path: .ntd/test-report.md
        gates:
          - name: 测试通过
            type: artifact_present
            artifact: test-report
        on_success: next
        on_gate_fail: s03
        max_rework: 2
      - id: s04
        name: 代码审查
        prompt: |
          审查本次变更，检查：逻辑正确性、边界条件、性能、安全。
          输出审查意见到 .ntd/code-review.md。
        executor: atomcode
        expert_name: senior-dev
        skills: []
        expected_artifacts:
          - name: code-review
            type: file
            path: .ntd/code-review.md
        gates:
          - name: 审查报告存在
            type: artifact_present
            artifact: code-review
        on_success: next
        on_gate_fail: s04
        max_rework: 1
      - id: s05
        name: 验证
        step_template: []
        prompt: |
          运行项目级测试与 lint（如 cargo test / npx tsc --noEmit / npm run build）。
          修复失败项，直到零错误零告警。
          将测试报告摘要写入 .ntd/test-report.md。
        expert: senior-dev
        skills: [4p12s-test]
        model: claude-sonnet-5
        acceptance_criteria: |
          测试与 lint 全部通过。
        expected_artifacts:
          - name: verify-report
            type: file
            path: .ntd/verify-report.md
        gates:
          - name: 验证通过
            type: artifact_present
            artifact: verify-report
        on_success: next
        on_gate_fail: s03
        max_rework: 2
      - id: s06
        name: 回顾总结
        prompt: |
          回顾本次任务，总结：做了什么、学到了什么、下次可以改进什么。
          输出到 .ntd/reflect.md。
        executor: atomcode
        expert_name: senior-dev
        skills: []
        expected_artifacts:
          - name: reflect
            type: file
            path: .ntd/reflect.md
        gates:
          - name: 回顾总结存在
            type: artifact_present
            artifact: reflect
        on_success: end
        on_gate_fail: s06
        max_rework: 1
