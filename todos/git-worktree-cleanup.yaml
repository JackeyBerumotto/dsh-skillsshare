title: "git worktree 清理"
category: "Git/CI"
prompt: |
  请你对本目录下的git worktree 进行清理。

  执行步骤：
  1. 列出所有 worktree：git worktree list
  2. 移除所有 worktree（除了当前目录和主仓库）：git worktree remove <path> --force
  3. 清理主仓库的构建产物：cargo clean
  4. 清理仓库本地缓存：rm -rf target ~/.cargo/registry/cache 2>/dev/null || true

  注意：只清理当前仓库相关路径，不要执行全局删除命令。
sort_order: 6